<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mostra Científica 2026 — Telão</title>
<style>
:root{--petrol:#0a252c;--petrol2:#06191e;--orange:#f18a2a;--white:#f7f8f5;--muted:#9fb1b5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--petrol2);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
main{height:100dvh;display:grid;place-items:center;padding:clamp(18px,3vw,36px) clamp(18px,3vw,30px) 38px;position:relative;background:radial-gradient(circle at 75% 18%,rgba(241,138,42,.08),transparent 28%),linear-gradient(135deg,#06191e,#0a2c34)}
.logo{position:absolute;top:22px;left:30px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--orange)}.class{position:absolute;top:22px;right:30px;color:var(--muted);font-weight:800}
.scene{width:min(1250px,94vw);max-height:calc(100dvh - 72px);text-align:center;display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--orange);font-size:15px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(42px,7vw,96px);line-height:.95;margin:12px 0}h2{font-size:clamp(30px,4.2vw,60px);line-height:1.03;margin:8px 0}p{font-size:clamp(16px,1.8vw,26px);color:var(--muted);max-width:900px;margin:14px auto;line-height:1.28}
.big{font-size:clamp(92px,18vw,260px);font-weight:950;line-height:.8;margin:34px 0;color:#fff}.unit{font-size:clamp(22px,3vw,42px);color:var(--muted);font-weight:700}
.ranking{display:grid;gap:12px;text-align:left;margin:28px auto 0;max-width:1000px}.row{display:grid;grid-template-columns:260px 1fr 80px;gap:16px;align-items:center;font-size:clamp(17px,1.7vw,26px);font-weight:850}.track{height:22px;border-radius:999px;background:#183941;overflow:hidden}.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#f18a2a,#ffc36f)}.winner{color:#ffc16a}
.cloud{display:flex;flex-wrap:wrap;gap:18px 28px;justify-content:center;align-items:center;margin-top:35px}.cloud span{font-weight:900;line-height:1;color:#eaf1ef}
.note{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#6f888e;font-size:12px}
@media(max-width:800px){.row{grid-template-columns:150px 1fr 52px}}


/* V6.3 — ranking em cartões verticais + gráfico de setores */
.ranking-scene{
  width:min(1140px,91vw);
  margin:0 auto;
  max-height:calc(100dvh - 120px);
}
.ranking-scene h2{
  font-size:clamp(30px,4.4vw,58px);
  margin-bottom:4px;
}
.ranking-layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:18px;
  align-items:stretch;
  width:min(1140px,91vw);
  margin:10px auto 0;
}
.top3-stack{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.top3-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:12px 16px;
  text-align:left;
  min-height:90px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.top3-pos{
  color:var(--orange);
  font-size:12px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.top3-theme{
  font-size:clamp(20px,1.9vw,28px);
  font-weight:900;
  margin-top:6px;
  line-height:1.02;
}
.top3-score{
  color:#ffc36f;
  font-size:clamp(22px,2vw,30px);
  font-weight:950;
  margin-top:6px;
}
.pie-panel{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:22px;
  padding:14px 16px 8px;
}
.pie-flex{
  display:grid;
  grid-template-columns:minmax(320px, 420px) 1fr;
  gap:10px 18px;
  align-items:center;
}
.pie-graphic{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:280px;
}
.pie-svg{
  width:min(100%, 330px);
  height:auto;
  overflow:visible;
}
.pie-legend{
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
  align-content:start;
}
.legend-item{
  display:grid;
  grid-template-columns:14px 1fr auto;
  gap:10px;
  align-items:center;
  min-width:0;
}
.legend-swatch{
  width:14px;
  height:14px;
  border-radius:50%;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;
}
.legend-theme{
  color:#dbe5e7;
  font-size:clamp(11px,.85vw,14px);
  line-height:1.1;
  font-weight:700;
}
.legend-value{
  color:#fff;
  font-size:clamp(11px,.85vw,14px);
  font-weight:900;
}
.pie-caption{
  margin-top:8px;
  text-align:center;
  color:var(--muted);
  font-size:clamp(11px,.85vw,14px);
}
.slice-pct{
  font-size:14px;
  font-weight:900;
  fill:#0a252c;
}
.slice-pct.small{
  font-size:12px;
}
@media(max-width:1100px){
  .ranking-layout{grid-template-columns:1fr;gap:16px}
  .top3-stack{display:grid;grid-template-columns:repeat(3,1fr)}
  .pie-flex{grid-template-columns:1fr}
  .pie-graphic{min-height:auto}
}


/* V6.3.1a — legenda alinhada à esquerda */
.pie-legend{
  justify-items:start;
}
.legend-item{
  width:100%;
}
.legend-theme,
.legend-value{
  text-align:left;
  justify-self:start;
}
.legend-item{
  grid-template-columns:14px minmax(0,1fr) auto;
}


/* V6.4 — DECIDA */
.decide-question{max-width:1080px;margin:0 auto;max-height:calc(100dvh - 110px)}
.decide-question h2{font-size:clamp(28px,3.6vw,50px);margin:6px 0 10px}
.vote-bars{display:grid;gap:10px;width:min(1020px,88vw);margin:14px auto 0;text-align:left}
.vote-row{display:grid;grid-template-columns:1fr 155px;gap:14px;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:12px 18px}
.vote-text{font-size:clamp(14px,1.2vw,19px);font-weight:750;line-height:1.22}
.vote-pct{font-size:clamp(24px,2.6vw,40px);font-weight:950;text-align:right;color:#ffc36f}
.vote-row.top-choice{border-color:rgba(241,138,42,.58);background:rgba(241,138,42,.08)}
.vote-row.top-choice .vote-pct{color:#ffc36f}
.choice-tag{display:inline-block;margin-left:8px;color:#ffc36f;font-size:10px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}


/* V6.4.1 — ajustes de altura, cor e encaixe em projeção */
.ranking-scene .pie-panel,
.ranking-scene .top3-card{box-shadow:0 8px 24px rgba(0,0,0,.10)}
.ranking-scene .legend-value{font-variant-numeric:tabular-nums}
.vote-bars + p{
  margin-top:16px;
  font-size:clamp(16px,1.9vw,24px);
  max-width:980px;
  line-height:1.22;
}
@media (max-height: 820px){
  .ranking-scene h2{font-size:clamp(26px,4vw,52px)}
  .top3-card{min-height:82px}
  .pie-graphic{min-height:250px}
  .pie-svg{width:min(100%, 300px)}
  .vote-row{padding:10px 16px}
  .vote-bars{gap:8px;margin-top:10px}
}


/* V6.5 — fechamento pedagógico */
.closing-scene{
  width:min(1080px,90vw);
  margin:0 auto;
  text-align:center;
}
.closing-scene h2{
  font-size:clamp(34px,4.7vw,64px);
  margin:8px 0 14px;
}
.closing-scene p{
  font-size:clamp(18px,2vw,28px);
  max-width:880px;
}
.concept-chain{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:28px auto 8px;
}
.concept-node{
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  font-weight:900;
  font-size:clamp(15px,1.55vw,22px);
}
.concept-arrow{
  color:var(--orange);
  font-size:24px;
  font-weight:950;
}
.signal-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:28px auto 0;
  max-width:900px;
}
.signal-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:18px;
}
.signal-icon{
  font-size:34px;
  margin-bottom:8px;
}
.signal-card b{
  display:block;
  font-size:clamp(16px,1.5vw,22px);
}
.signal-card span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}
.dual-grid{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  gap:18px;
  margin:28px auto 0;
  max-width:940px;
}
.dual-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:24px;
}
.dual-card strong{
  display:block;
  font-size:clamp(22px,2.3vw,34px);
  margin:8px 0;
}
.dual-plus{
  font-size:42px;
  color:var(--orange);
  font-weight:950;
}
.profile-box{
  margin:28px auto 0;
  max-width:880px;
  background:linear-gradient(135deg,rgba(241,138,42,.12),rgba(255,255,255,.04));
  border:1px solid rgba(241,138,42,.30);
  border-radius:24px;
  padding:24px;
}
.profile-box strong{
  color:#ffc36f;
}
.value-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  max-width:1000px;
  margin:26px auto 0;
}
.value-card{
  border-radius:18px;
  padding:18px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}
.value-card b{font-size:18px}
.value-card span{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.privacy-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:960px;
  margin:28px auto 0;
}
.privacy-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:20px;
}
.privacy-card .num{
  color:var(--orange);
  font-weight:950;
  font-size:12px;
  letter-spacing:.12em;
}
.privacy-card b{
  display:block;
  margin:8px 0;
  font-size:20px;
}
.jobs-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin:24px auto 0;
  max-width:1000px;
  text-align:left;
}
.jobs-box{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:22px;
}
.jobs-box h3{
  color:#ffc36f;
  margin:0 0 12px;
  font-size:20px;
}
.jobs-cloud{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.job-pill{
  padding:8px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  color:#e6eff0;
  font-size:13px;
  font-weight:800;
}
.final-definition{
  font-size:clamp(34px,5vw,70px);
  line-height:1.04;
  font-weight:950;
  max-width:980px;
  margin:18px auto;
}
.final-definition span{color:#ffc36f}
@media(max-width:800px){
  .signal-grid,.value-grid,.privacy-list,.jobs-wrap{grid-template-columns:1fr 1fr}
  .dual-grid{grid-template-columns:1fr}
  .dual-plus{line-height:1}
}


/* V7.0 — fechamento com área segura para 1366x768 */
.closing-scene{
  width:min(1040px,88vw);
  max-height:calc(100dvh - 92px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.closing-scene h2{font-size:clamp(30px,4vw,54px);margin:5px 0 10px;line-height:1.02}
.closing-scene p{font-size:clamp(15px,1.55vw,22px);margin:10px auto;line-height:1.25}
.concept-chain{margin:18px auto 6px;gap:8px}
.concept-node{padding:10px 15px;font-size:clamp(14px,1.35vw,19px)}
.signal-grid{gap:10px;margin:18px auto 0}
.signal-card{padding:13px}.signal-icon{font-size:28px;margin-bottom:5px}
.signal-card b{font-size:clamp(14px,1.3vw,18px)}.signal-card span{font-size:11px}
.dual-grid{margin:18px auto 0}.dual-card{padding:17px}.dual-card strong{font-size:clamp(19px,2vw,28px)}
.profile-box{margin:18px auto 0;padding:17px}
.value-grid{gap:10px;margin:18px auto 0}.value-card{padding:14px}
.privacy-list{gap:10px;margin:18px auto 0}.privacy-card{padding:15px}.privacy-card b{font-size:18px}
.jobs-wrap{gap:12px;margin:16px auto 0}.jobs-box{padding:16px}.job-pill{padding:6px 9px;font-size:11px}
.final-definition{font-size:clamp(30px,4.5vw,60px);margin:12px auto}
.bridge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:940px;margin:18px auto 0}
.bridge-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
.bridge-card b{display:block;color:#ffc36f;font-size:18px;margin-bottom:5px}.bridge-card span{font-size:12px;color:var(--muted)}


/* V8.0 — contexto do DECIDA e desempate */
.decide-context-telao{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(960px,86vw);margin:14px auto}
.decide-context-telao div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:13px 16px;text-align:left}
.decide-context-telao b{display:block;color:#ffc36f;font-size:10px;letter-spacing:.12em;margin-bottom:4px}
.decide-context-telao span{font-size:14px;line-height:1.25;color:#e4ecee}

/* V8.1 — área segura de projeção e proporção */
main{display:flex;align-items:center;justify-content:center;padding:64px 30px 34px}
.scene{width:min(1250px,94vw);height:calc(100dvh - 104px);max-height:none;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.closing-scene{max-height:100%;overflow:hidden}
@media(max-height:780px){

}
.vote-metrics{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.vote-share{font-size:clamp(23px,2.5vw,38px);font-weight:950;color:#ffc36f}
.support-score{font-size:11px;font-weight:900;color:#9fd6c0;text-transform:uppercase;letter-spacing:.05em}
.support-explain{font-size:12px!important;color:#93a9ae!important;margin-top:10px!important}

.mc-qr-placeholder[hidden]{display:none!important}
.mc-qr-address{font-size:12px;color:#f9bb70;line-height:1.3;overflow-wrap:anywhere;max-width:300px;text-align:center}
.mc-qr-address[hidden]{display:none!important}
.mc-qr-button{appearance:none;font:inherit;border:1px solid #65818b;background:#0b2c35;border-radius:10px;padding:8px 12px;color:#fff;font-weight:700;font-size:12px;cursor:pointer}

(function(root,factory){
  const api=factory();
  if(typeof module==='object' && module.exports) module.exports=api;
  root.M9Engine=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
  function medianValue(values){
    const a=(values||[]).map(Number).filter(v=>Number.isFinite(v)&&v>0).sort((x,y)=>x-y);
    if(!a.length)return 0;
    const m=Math.floor(a.length/2);
    return a.length%2?a[m]:(a[m-1]+a[m])/2;
  }

  function reactionScoreMap(reactions,posts){
    const themes=[...new Set((posts||[]).flatMap(p=>[p.theme,p.secondary].filter(Boolean)))];
    const score=Object.fromEntries(themes.map(t=>[t,0]));
    (reactions||[]).forEach(r=>{
      const p=(posts||[]).find(x=>x.id===r.post_id);
      if(!p)return;
      if(r.reaction==='heart'){
        score[p.theme]=(score[p.theme]||0)+5;
        if(p.secondary)score[p.secondary]=(score[p.secondary]||0)+2;
      }
      if(r.reaction==='thumb'){
        score[p.theme]=(score[p.theme]||0)+3;
        if(p.secondary)score[p.secondary]=(score[p.secondary]||0)+1;
      }
    });
    return score;
  }

  function attentionScoreMap(attention,posts){
    const themes=[...new Set((posts||[]).flatMap(p=>[p.theme,p.secondary].filter(Boolean)))];
    const out=Object.fromEntries(themes.map(t=>[t,0]));
    const bySession={};
    (attention||[]).forEach(a=>{
      const ms=Math.max(0,Math.min(Number(a.duration_ms)||0,10000));
      if(!ms)return;
      (bySession[a.session_id] ||= []).push({...a,_ms:ms});
    });
    Object.values(bySession).forEach(rows=>{
      const med=medianValue(rows.map(r=>r._ms))||1;
      rows.forEach(r=>{
        const p=(posts||[]).find(x=>x.id===r.post_id);
        if(!p)return;
        const relative=Math.min(2,r._ms/med);
        out[p.theme]=(out[p.theme]||0)+relative;
        if(p.secondary)out[p.secondary]=(out[p.secondary]||0)+relative*.4;
      });
    });
    return out;
  }

  function ranking(reactions,attention,posts){
    const scores=reactionScoreMap(reactions,posts);
    const att=attentionScoreMap(attention,posts);
    return Object.entries(scores)
      .map(([theme,score])=>({theme,score,attention:att[theme]||0}))
      .sort((a,b)=>(b.score-a.score)||(b.attention-a.attention)||a.theme.localeCompare(b.theme,'pt-BR'));
  }

  function percent(v,total,decimals=1){
    if(!total)return 0;
    const f=10**decimals;
    return Math.round((Number(v)||0)*100*f/total)/f;
  }

  function supportIndex(rows,choiceCode){
    const values=(rows||[])
      .filter(r=>r.choice_code===choiceCode)
      .flatMap(r=>(Array.isArray(r.evidence_json)?r.evidence_json:[])
        .map(e=>Number(e.strength)).filter(Number.isFinite));
    return values.length?Math.round(values.reduce((a,b)=>a+b,0)/values.length):0;
  }

  function makeRunId(){
    return (globalThis.crypto&&crypto.randomUUID)
      ? crypto.randomUUID()
      : 'run-'+Date.now()+'-'+Math.random().toString(16).slice(2);
  }

  function filterRun(data,group='ALL'){
    const runId=data?.state?.run_id;
    let sessions=(data?.sessions||[]).filter(s=>!runId || !s.run_id || s.run_id===runId);
    if(group!=='ALL')sessions=sessions.filter(s=>s.class_group===group);
    const ids=new Set(sessions.map(s=>s.id));
    const pick=arr=>(arr||[]).filter(x=>ids.has(x.session_id));
    return {
      ...data,
      sessions,
      reactions:pick(data?.reactions),
      attention:pick(data?.attention),
      events:pick(data?.events),
      investigationAnswers:pick(data?.investigationAnswers),
      decisionAnswers:pick(data?.decisionAnswers)
    };
  }


  function stageReadiness(state,metrics,target){
    state=state||{status:'waiting',reveal_stage:0};
    metrics=metrics||{};
    target=Math.max(0,Number(target)||0);

    const total=Number(metrics.total)||0;
    const feedDone=Number(metrics.feedDone)||0;
    const reactions=Number(metrics.reactions)||0;
    const investDone=Number(metrics.investDone)||0;
    const decisionDone=Number(metrics.decisionDone)||0;
    const st=state.status||'waiting';
    const stage=Number(state.reveal_stage)||0;

    const countStatus=(done,hasData=true)=>{
      if(!hasData || done<=0)return 'no';
      if(target>0 && done<target)return 'warn';
      return 'ok';
    };

    const feed = total<=0 ? 'no' : (target>0 && total<target ? 'warn' : 'ok');

    // REVELE só fica disponível depois de FEED_CLOSED.
    const reveal = st!=='feed_closed' && st!=='results_reveal' &&
      !['investigation_preview','investigation_open','decide_preview','decide_open','decide_reveal','closing_reveal'].includes(st)
        ? 'no'
        : countStatus(feedDone,reactions>0);

    // Apresentar INVESTIGUE exige a última cena do REVELE.
    let investigatePreview='no';
    if(st==='results_reveal'){
      investigatePreview = stage>=6 ? 'ok' : 'warn';
    }else if(['investigation_preview','investigation_open','decide_preview','decide_open','decide_reveal','closing_reveal'].includes(st)){
      investigatePreview='ok';
    }

    // Liberar respostas somente após a apresentação da investigação.
    const investigateRelease = st==='investigation_preview' || st==='investigation_open' ? 'ok' : 'no';

    // DECIDA só existe depois de INVESTIGATION_OPEN e conclusão da investigação.
    let decide='no';
    if(['investigation_open','decide_preview','decide_open','decide_reveal','closing_reveal'].includes(st)){
      decide=countStatus(investDone,true);
    }

    // Revelação das decisões somente em DECIDE_OPEN (ou depois) e com decisões concluídas.
    let decisionReveal='no';
    if(['decide_open','decide_reveal','closing_reveal'].includes(st)){
      decisionReveal=countStatus(decisionDone,true);
    }

    // Fechamento somente depois da revelação das decisões.
    let closing='no';
    if(['decide_reveal','closing_reveal'].includes(st)){
      closing=countStatus(decisionDone,true);
    }

    return {feed,reveal,investigatePreview,investigateRelease,decide,decisionReveal,closing};
  }

  function canAction(action,state,readiness,forceCounts=false){
    state=state||{status:'waiting',reveal_stage:0};
    readiness=readiness||{};
    const st=state.status||'waiting';
    const stage=Number(state.reveal_stage)||0;
    const ready=k=>readiness[k]==='ok' || (forceCounts && readiness[k]==='warn');

    switch(action){
      case 'openFeed':
        return (st==='waiting' || st==='feed_paused') && ready('feed');
      case 'pauseFeed':
        return st==='feed_open';
      case 'closeFeed':
        return st==='feed_open' || st==='feed_paused';
      case 'startReveal':
        return st==='feed_closed' && ready('reveal');
      case 'revealPrev':
      case 'revealNext':
        return st==='results_reveal';
      case 'previewInvestigation':
        return st==='results_reveal' && stage>=6 && ready('investigatePreview');
      case 'releaseInvestigation':
        return st==='investigation_preview';
      case 'previewDecide':
        return st==='investigation_open' && ready('decide');
      case 'startDecide':
        return st==='decide_preview';
      case 'revealDecide':
        return st==='decide_open' && ready('decisionReveal');
      case 'startClosing':
        return st==='decide_reveal' && ready('closing');
      case 'closingPrev':
      case 'closingNext':
        return st==='closing_reveal';
      default:
        return false;
    }
  }

  return {medianValue,reactionScoreMap,attentionScoreMap,ranking,percent,supportIndex,makeRunId,filterRun,stageReadiness,canAction};
});

function dg(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}

      return {sessions:[],reactions:[],attention:[],events:[],decisionAnswers:[],state};

}

    reactions:base.reactions.filter(r=>ids.has(r.session_id)),

}

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

};

var QRMaskPattern = require('./QRMaskPattern');

    PATTERN_POSITION_TABLE : [
        [],
        [6, 18],

        [6, 30, 54, 78, 102],
        [6, 28, 54, 80, 106],
        [6, 32, 58, 84, 110],
        [6, 30, 58, 86, 114],
        [6, 34, 62, 90, 118],
        [6, 26, 50, 74, 98, 122],
        [6, 30, 54, 78, 102, 126],
        [6, 26, 52, 78, 104, 130],
        [6, 30, 56, 82, 108, 134],
        [6, 34, 60, 86, 112, 138],
        [6, 30, 58, 86, 114, 142],
        [6, 34, 62, 90, 118, 146],
        [6, 30, 54, 78, 102, 126, 150],
        [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],
        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;
    },

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

};

var QR8bitByte = require('./QR8bitByte');
var QRUtil = require('./QRUtil');
var QRPolynomial = require('./QRPolynomial');
var QRRSBlock = require('./QRRSBlock');
var QRBitBuffer = require('./QRBitBuffer');

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

 const QR=rq('index'), ec=rq('QRErrorCorrectLevel');
 window.MCQR={
   createSvgDataUrl: function(payload){
     const qr=new QR(-1,ec.M);
     qr.addData(payload);qr.make();
     const modules=qr.getModuleCount(),quiet=4,dim=modules+quiet*2;
     let d='';
     for(let y=0;y<modules;y++)for(let x=0;x<modules;x++)if(qr.isDark(y,x))d+='M'+(x+quiet)+' '+(y+quiet)+'h1v1h-1z';
     const svg='<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 '+dim+' '+dim+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="'+d+'"/></svg>';
     return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
   }
 };
})();

<script>
(function(){
 const key='mc_participantes_public_url';
 let cachedPayload='',cachedQR='';
 const valid=(raw)=>{
  try {
   const u=new URL(String(raw).trim());
   if(!['http:','https:'].includes(u.protocol))return null;
   if(['localhost','127.0.0.1','0.0.0.0','[::1]'].includes(u.hostname.toLowerCase()))return null;
   if(!u.hostname)return null;
   return u.href;
  } catch (_) {return null;}
 };
 const saved=()=>{try{return localStorage.getItem(key)||''}catch(_){return ''}};
 function participantAddress(){
   // Endereco publico fixo: QR visivel mesmo quando o telão e aberto localmente.
   return 'https://profprogerios.github.io/mostra-cientifica-2026/participantes.html';
 }
 function updateQR(){
  const img=document.getElementById('mcQRCode');if(!img)return;
  const url=participantAddress();
  const status=document.getElementById('mcQRMessage');
  const address=document.getElementById('mcQRAddress');
  const placeholder=document.getElementById('mcQRPlaceholder');
  const manualButton=document.querySelector('.mc-qr-button');
  if(manualButton){
    manualButton.hidden=!url;
    manualButton.textContent='Usar outro endereço (opcional)';
  }
  if(!url){
    img.hidden=true;if(placeholder)placeholder.hidden=false;
    if(status)status.textContent=location.protocol==='file:'
      ? 'Para exibir o QR Code, extraia o pacote e execute INICIAR_MOSTRA_WINDOWS.bat. O telão abrirá automaticamente pelo endereço de rede.'
      : 'Abra o telão pelo endereço IPv4 do computador, não por localhost. Use o iniciador do pacote.';
    if(address)address.hidden=true;
    return;
  }
  if(url!==cachedPayload){
    try{cachedQR=window.MCQR.createSvgDataUrl(url);cachedPayload=url;}
    catch(e){console.error('Erro ao criar QR Code:',e);if(status)status.textContent='Erro ao gerar QR Code. Verifique o endereço.';return;}
  }
  if(img.src!==cachedQR)img.src=cachedQR;
  img.hidden=false;if(placeholder)placeholder.hidden=true;
  if(status)status.textContent='Aponte a câmera do celular para participar.';
  if(address){address.href=url;address.textContent=url;address.hidden=false;}
 }
 window.mcOpenQRSetup=function(){
  const input=document.getElementById('mcQRInput');
  if(input)input.value=saved()||(['http:','https:'].includes(location.protocol)?new URL('participantes.html',location.href).href:'');
  document.getElementById('mcQRSetup')?.classList.add('open');
  document.getElementById('mcQRError').textContent='';
  setTimeout(()=>input?.focus(),0);
 };
 window.mcCloseQRSetup=function(){document.getElementById('mcQRSetup')?.classList.remove('open');};
 window.mcSaveQRSetup=function(e){
   if(e)e.preventDefault();
   const input=document.getElementById('mcQRInput');
   const raw=input?.value.trim()||'';
   const error=document.getElementById('mcQRError');
   if(raw && !valid(raw)){if(error)error.textContent='Use um endereço HTTP(S) acessível pelo celular. Não use file:// ou localhost.';return;}
   try{if(raw)localStorage.setItem(key,valid(raw));else localStorage.removeItem(key);}catch(err){if(error)error.textContent='Não foi possível salvar a configuração no navegador.';return;}
   cachedPayload='';cachedQR='';mcCloseQRSetup();updateQR();
 };
 document.body.insertAdjacentHTML('beforeend',`<div id="mcQRSetup" role="dialog" aria-modal="true" aria-label="Configurar QR Code"><div class="mc-qr-dialog"><h2>Endereço de acesso</h2><p>Informe a URL publicada de <strong>participantes.html</strong> ou use a URL HTTP do computador na mesma rede Wi-Fi. O código será gerado sem serviços externos.</p><form onsubmit="mcSaveQRSetup(event)"><label for="mcQRInput">URL acessível pelo celular</label><input id="mcQRInput" type="url" placeholder="https://.../participantes.html" autocomplete="url"><div class="mc-qr-error" id="mcQRError"></div><div class="mc-qr-actions"><button type="button" class="mc-close" onclick="mcCloseQRSetup()">Cancelar</button><button type="submit" class="mc-save">Gerar QR Code</button></div></form><p style="font-size:12px">Deixe o campo vazio e salve para usar automaticamente a página participantes.html na mesma pasta do telão.</p></div></div>`);
 // A atualização é chamada após cada renderização da cena pelo telão.
 // Não observar mutações de filhos: alterações de texto do QR causavam um ciclo infinito.
 window.mcRefreshQRCode=updateQR;
 updateQR();
})();
